<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./main.css" />
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js"
        }
      }
    </script>
    <script type="module" src="./scripts/index.js"></script>
    <title>Drag and Drop</title>
  </head>
  <body>
    <template id="fields">
      <form>
        <div class="form-control">
          <label for="title">title</label>
          <input id="title" type="text" />
        </div>
        <div class="form-control">
          <label for="desc">description</label>
          <input id="desc" type="text" />
        </div>
        <div class="form-control">
          <label for="project-status">list</label>
          <select id="project-status"></select>
        </div>
        <button class="btn">add project</button>
      </form>
    </template>
    <template id="add-list">
      <div id="add-list-wrapper" class="projects add-list-container">
        <div id="add-list-button" class="add-list-button">
          <i class="bx bx-plus"></i>
          <span>Add another list</span>
        </div>
        <form id="add-list-form" class="add-list-form">
          <input
            class="new-list-name"
            type="text"
            placeholder="Enter list title..."
          />
          <div class="add-list-controls">
            <button class="btn add-list-btn">Add list</button>
            <i class="bx bx-x close-form"></i>
          </div>
        </form>
      </div>
    </template>
    <template id="projects-list">
      <div class="projects lists-actions">
        <div class="title-header">
          <h2 class="title"></h2>
          <div class="list-actions">
            <button class="edit-list edit-list-btn">
              <i class="bx bx-edit"></i>
            </button>
            <button class="delete-list delete-list-btn">
              <i class="bx bx-trash"></i>
            </button>
          </div>
        </div>
        <ul class="projects-list"></ul>
      </div>
    </template>
    <!-- <template id="project-list">
      <div class="projects">
        <div class="title-header">
          <h2 class="title"></h2>
        </div>
        <div class="projects-list"></div>
      </div>
    </template> -->
    <template id="project-item">
      <div class="project" draggable="true">
        <h2 class="project_title" id="project_title"></h2>
        <p class="project_desc" id="project_desc"></p>
        <div class="project_icons">
          <button class="edit edit-list-btn">
            <i class="bx bx-edit"></i>
          </button>
          <button class="delete delete-list-btn">
            <i class="bx bx-trash"></i>
          </button>
        </div>
      </div>
    </template>
    <template id="popup_template">
      <div class="popup_container" id="popup_container">
        <div class="popup">
          <div class="header">
            <h4 class="popup_title">Alert</h4>
            <button class="close">
              <i class="bx bx-x"></i>
            </button>
          </div>
          <div class="content">
            <p class="desc_popup"></p>
            <div class="popup_form hidden"></div>
          </div>
          <div class="popup_actions">
            <button class="cancel-popup-btn hidden" type="button">
              Cancel
            </button>
            <button class="confirm-popup-btn" type="button">OK</button>
          </div>
        </div>
      </div>
    </template>
    <div id="app"></div>
  </body>
</html>
